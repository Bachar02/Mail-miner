[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-contact-miner"
version = "0.1.0"
description = "Local-first extraction of professional contacts from internship emails"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.35", "pandas>=2.0", "openpyxl>=3.1"]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
contact-miner = "contact_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
